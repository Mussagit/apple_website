<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Add New Product — Apple Replica</title>

		<!-- Bootstrap 5 -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet" />

		<!-- Bootstrap Icons -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
			rel="stylesheet" />

		<!-- Custom CSS -->
		<link rel="stylesheet" href="style.css" />
		<style>
			.feedback-msg {
				display: none;
				border-radius: 10px;
				padding: 10px 14px;
				margin-bottom: 15px;
				font-size: 13px;
				font-weight: 500;
				animation: fadeIn 0.3s ease;
			}
			.feedback-msg.success {
				background: rgba(40, 167, 69, 0.2);
				color: #155724;
				border: 1px solid rgba(40, 167, 69, 0.4);
			}
			.feedback-msg.error {
				background: rgba(220, 53, 69, 0.2);
				color: #721c24;
				border: 1px solid rgba(220, 53, 69, 0.4);
			}
			@keyframes fadeIn {
				from { opacity: 0; transform: translateY(-6px); }
				to { opacity: 1; transform: translateY(0); }
			}
		</style>
	</head>

	<body>
		<main class="product-page">
			<!-- Phone image -->
			<div class="iphone-graphic"></div>

			<!-- Centered transparent form -->
			<div class="glass-card">
				<h2 class="product-title">Add New Product</h2>

				<div id="feedbackAlert" class="feedback-msg"></div>

				<form
					id="productForm"
					action="http://localhost:5050/api/add-product"
					method="POST">
					<!-- Product Name -->
					<div class="form-group">
						<label for="product_name"> Product Name </label>
						<input
							type="text"
							id="product_name"
							name="product_name"
							class="form-control glass-input"
							placeholder="e.g. iPhone 16 Pro"
							required />
					</div>

					<!-- Product URL / Slug -->
					<div class="form-group">
						<label for="product_url"> Product URL / Slug </label>
						<div class="input-wrapper">
							<input
								type="text"
								id="product_url"
								name="product_url"
								class="form-control glass-input"
								placeholder="e.g. iphone16pro or https://..."
								required />
							<i class="bi bi-link-45deg input-icon"></i>
						</div>
					</div>

					<!-- Brief Description -->
					<div class="form-group">
						<label for="product_brief_description"> Brief Description </label>
						<input
							type="text"
							id="product_brief_description"
							name="product_brief_description"
							class="form-control glass-input"
							placeholder="Brief Description / Tagline"
							required />
					</div>

					<!-- Full Description -->
					<div class="form-group">
						<label for="product_description"> Full Description </label>
						<textarea
							id="product_description"
							name="product_description"
							class="form-control glass-input description-input"
							placeholder="Detailed Product Description"
							rows="2"
							required></textarea>
					</div>

					<!-- Image URL -->
					<div class="form-group">
						<label for="product_img"> Image URL </label>
						<div class="input-wrapper">
							<input
								type="url"
								id="product_img"
								name="product_img"
								class="form-control glass-input"
								placeholder="https://.../product.jpg"
								required />
							<i class="bi bi-image input-icon"></i>
						</div>
					</div>

					<!-- Product Link -->
					<div class="form-group">
						<label for="product_link"> Product Link </label>
						<div class="input-wrapper">
							<input
								type="url"
								id="product_link"
								name="product_link"
								class="form-control glass-input"
								placeholder="https://www.apple.com/iphone"
								required />
							<i class="bi bi-link-45deg input-icon"></i>
						</div>
					</div>

					<!-- Prices -->
					<div class="row price-row">
						<!-- Starting Price -->
						<div class="col-6">
							<label for="starting_price"> Starting Price </label>
							<input
								type="text"
								id="starting_price"
								name="starting_price"
								class="form-control glass-input"
								placeholder="e.g. $999"
								required />
						</div>

						<!-- Price Range -->
						<div class="col-6">
							<label for="price_range"> Price Range </label>
							<input
								type="text"
								id="price_range"
								name="price_range"
								class="form-control glass-input"
								placeholder="e.g. From $41.62/mo."
								required />
						</div>
					</div>

					<!-- Submit -->
					<button type="submit" id="submitBtn" class="btn submit-btn w-100">
						Submit Product
					</button>
				</form>
			</div>
		</main>

		<!-- Bootstrap JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

		<script>
			const form = document.getElementById("productForm");
			const submitBtn = document.getElementById("submitBtn");
			const feedback = document.getElementById("feedbackAlert");

			form.addEventListener("submit", async function (e) {
				e.preventDefault();

				submitBtn.disabled = true;
				submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Adding...`;
				feedback.style.display = "none";

				const formData = {
					product_name: document.getElementById("product_name").value.trim(),
					product_url: document.getElementById("product_url").value.trim(),
					product_brief_description: document.getElementById("product_brief_description").value.trim(),
					product_description: document.getElementById("product_description").value.trim(),
					product_img: document.getElementById("product_img").value.trim(),
					product_link: document.getElementById("product_link").value.trim(),
					starting_price: document.getElementById("starting_price").value.trim(),
					price_range: document.getElementById("price_range").value.trim(),
				};

				try {
					const response = await fetch("http://localhost:5050/api/add-product", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(formData),
					});

					const result = await response.json();

					if (response.ok) {
						feedback.className = "feedback-msg success";
						feedback.innerHTML = `✅ <strong>Success!</strong> ${formData.product_name} added (ID: ${result.product_id || "OK"}).`;
						feedback.style.display = "block";
						form.reset();
					} else {
						feedback.className = "feedback-msg error";
						feedback.innerHTML = `❌ <strong>Error:</strong> ${result.message || "Failed to add product"}`;
						feedback.style.display = "block";
					}
				} catch (err) {
					console.error("Submission error:", err);
					feedback.className = "feedback-msg error";
					feedback.innerHTML = `❌ <strong>Error:</strong> Could not connect to backend server at http://localhost:5050`;
					feedback.style.display = "block";
				} finally {
					submitBtn.disabled = false;
					submitBtn.innerText = "Submit Product";
				}
			});
		</script>
	</body>
</html>
